db.driver=org.h2.Driver
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.jdbc.time_zone=UTC

app.cookie.name=session_token
app.cookie.secure=false

app.jwt.secret=test-only-secret-key-at-least-32-bytes-long-not-for-real-use
app.jwt.expiry-minutes=60

app.login.max-failed-attempts=10
app.login.lockout-minutes=15

# No real SMTP in tests: send() hits a refused local port and HrEmpFlow swallows it.
app.mail.host=localhost
app.mail.port=2525
app.mail.username=test
app.mail.password=test
app.mail.from=noreply@test.local
app.verify.link-base=http://localhost/verify-email
app.verify.resend-cooldown-seconds=60
app.reset.link-base=http://localhost/reset-password.html
app.reset.request-cooldown-seconds=60

app.import.max-rows=500

app.photo.max-bytes=2097152

# scheduler.EmailSender is still component-scanned in tests (TestConfig scans the same
# base package), so its @Value fields must resolve even though @EnableScheduling (only
# on AppConfig, which TestConfig excludes) never actually fires it.
app.mail.batch-size=20
app.mail.poll-delay-ms=15000
app.mail.max-attempts=5
app.mail.reaper.batch-size=20
app.mail.reaper.retention-days=30
app.mail.reaper.poll-delay-ms=3600000

# Billing -- same reasoning as the mail block above, plus razorpay.enabled=false keeps
# RazorpayGatewayService on its synthetic stub so no credentials are needed here.
razorpay.enabled=false
razorpay.key-id=
razorpay.key-secret=
razorpay.webhook-secret=
app.billing.grace-period-days=7
app.billing.reconcile.batch-size=20
app.billing.reconcile.poll-delay-ms=900000
app.billing.grace-expiry.batch-size=20
app.billing.grace-expiry.poll-delay-ms=3600000
app.billing.portal-link-base=http://localhost/billing.html
