db.driver=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/leave?useSSL=true&serverTimezone=UTC}
db.username=${DB_USERNAME:user-leaveManagement}
# Read from the DB_PASSWORD environment variable; blank if unset (test/H2 path).
# Never commit a real value here.
db.password=${DB_PASSWORD:}

hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Hibernate owns the schema directly -- no Flyway. It only adds what's missing
# (new tables/columns), never drops or narrows anything on its own.
hibernate.hbm2ddl.auto=update
# Store/read every Instant as UTC regardless of the server's default zone.
hibernate.jdbc.time_zone=UTC

app.cookie.name=session_token
# Secure by default; set APP_COOKIE_SECURE=false for plain-HTTP localhost.
app.cookie.secure=${APP_COOKIE_SECURE:true}
# Strict by default -- this is the CSRF control for the cookie-borne session token (see
# SecurityConfig's csrf disable()). Only safe to relax below Lax if frontend and backend
# are ever split across different sites (not just different subdomains/ports of one site).
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}

# Read from the JWT_SECRET environment variable, same convention as db.password.
# Never commit a real signing key here. Must be at least 32 bytes (HS256) once set.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=60

app.login.max-failed-attempts=10
app.login.lockout-minutes=15

# Google reCAPTCHA v3 on signup/login/forgot-password (security-standards). Disabled by
# default -- CAPTCHA_ENABLED unset -- so local dev and the test suite need no live
# credentials; set CAPTCHA_ENABLED=true and CAPTCHA_SECRET in any environment with a real
# reCAPTCHA site key configured on the frontend. See CaptchaService.
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.score-threshold=${CAPTCHA_SCORE_THRESHOLD:0.5}

# Mailjet SMTP relay. username = API key, password = Secret key -- both come from
# the env, same convention as db.password. Never commit real values here.
app.mail.host=${SMTP_HOST:in-v3.mailjet.com}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
# Validated sender address on the Mailjet account (Account Settings -> Senders & Domains).
app.mail.from=${SMTP_FROM:}
# Base of the "verify your email" link mailed to new employees; the signed token
# is appended as ?token=... Hits the BACKEND so the token is checked server-side
# (no CORS/cookie hop from the mail client); the endpoint then 302s to
# app.verify.redirect-base on the frontend.
app.verify.link-base=${VERIFY_LINK_BASE:http://localhost:8082/api/auth/verify-email}
# Frontend page the browser lands on after the check: ?verified=1 on success,
# ?verified=0 on a bad/expired link.
app.verify.redirect-base=${VERIFY_REDIRECT_BASE:http://localhost:8080/verify-email.html}
# Minimum gap between two POST /api/auth/resend-verification requests from the same user.
app.verify.resend-cooldown-seconds=${VERIFY_RESEND_COOLDOWN_SECONDS:60}
# Base of the "reset your password" link mailed on a forgot-password request; the signed
# 30-minute token is appended as ?token=... Points straight at the FRONTEND reset page
# (contrast app.verify.link-base, which hits the backend first) -- the page POSTs the new
# password to /api/auth/reset-password.
app.reset.link-base=${RESET_LINK_BASE:http://localhost:8080/reset-password.html}
# Minimum gap between two POST /api/auth/forgot-password requests for the same
# (orgUsername, email) pair.
app.reset.request-cooldown-seconds=${RESET_REQUEST_COOLDOWN_SECONDS:60}

# Base of the onboarding "set your password" link mailed when HR creates an employee
# (no password yet); the signed 7-day token is appended as ?token=... Points straight
# at the FRONTEND set-password page (same posture as app.reset.link-base) -- the page
# POSTs the new password to /api/auth/set-password.
app.invite.link-base=${INVITE_LINK_BASE:http://localhost:8080/set-password.html}
# Plain link (no token) to the frontend login page, mailed by ApprovalMailer once HR
# approves an onboarding-gated employee (POST /hr/employees/{id}/approve).
app.login.link-base=${LOGIN_LINK_BASE:http://localhost:8080/login.html}

# Max rows accepted in one POST /api/hr/employees/import; over this the whole
# request is 400 before any row is touched.
app.import.max-rows=${IMPORT_MAX_ROWS:500}

# Max size for PUT /api/employees/me/photo (bytes). AppInitializer's servlet-level
# MultipartConfigElement is a fixed, higher safety net above this.
app.photo.max-bytes=${PHOTO_MAX_BYTES:2097152}

# email_outbox poller (scheduler.EmailSender): how many PENDING rows it takes per pass,
# how long it waits between passes, and how many failed tries before a row is
# permanently FAILED instead of retried.
app.mail.batch-size=${MAIL_BATCH_SIZE:20}
app.mail.poll-delay-ms=${MAIL_POLL_DELAY_MS:15000}
app.mail.max-attempts=${MAIL_MAX_ATTEMPTS:5}
# email_outbox reaper (scheduler.EmailOutboxReaper): deletes SENT/FAILED rows older than
# retention-days, batch-size rows per transaction, once per poll-delay-ms (default hourly).
app.mail.reaper.batch-size=${MAIL_REAPER_BATCH_SIZE:20}
app.mail.reaper.retention-days=${MAIL_REAPER_RETENTION_DAYS:30}
app.mail.reaper.poll-delay-ms=${MAIL_REAPER_POLL_DELAY_MS:3600000}

# Billing / subscription (see prompts/features/billing-subscription.md). Disabled by
# default -- RazorpayGatewayService's synthetic stub runs everywhere until real
# credentials are supplied (and its licence is confirmed -- see prompts/libraries.md).
razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Grace window after a payment first starts failing before auto-downgrade to FREE.
app.billing.grace-period-days=${BILLING_GRACE_PERIOD_DAYS:7}
# SubscriptionScheduler.reconcile: catch-all poll for a webhook Razorpay delivered but
# this server missed.
app.billing.reconcile.batch-size=${BILLING_RECONCILE_BATCH_SIZE:20}
app.billing.reconcile.poll-delay-ms=${BILLING_RECONCILE_POLL_DELAY_MS:900000}
# SubscriptionScheduler.expireGrace: downgrades any org whose grace window has lapsed.
app.billing.grace-expiry.batch-size=${BILLING_GRACE_EXPIRY_BATCH_SIZE:20}
app.billing.grace-expiry.poll-delay-ms=${BILLING_GRACE_EXPIRY_POLL_DELAY_MS:3600000}
# Frontend billing/subscription page the 3 billing notice emails link to.
app.billing.portal-link-base=${BILLING_PORTAL_LINK_BASE:http://localhost:8080/billing.html}
